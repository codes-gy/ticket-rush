services:
  postgres:
    image: postgres:16-alpine
    container_name: ticket-rush-postgres
    environment:
      POSTGRES_DB: ticket_rush
      POSTGRES_USER: ticket_rush
      POSTGRES_PASSWORD: ticket_rush
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ticket-rush-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
